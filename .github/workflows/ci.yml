# CI：在 Windows / macOS / Debian / Arch 上配置并构建 Qt6/QML 工程；Android 为实验性脚手架。
# CI: configure & build on Windows / macOS / Debian / Arch; Android is an experimental scaffold.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- 原生 Runner：Windows / macOS，Qt 由 install-qt-action 缓存复用 ----
  # Native runners: Qt cached via install-qt-action.
  native:
    strategy:
      fail-fast: false
      matrix:
        target: [windows, macos]
        include:
          - target: windows
            runner: windows-latest
          - target: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          modules: qt5compat
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdei-connect-${{ matrix.target }}
          path: build
          retention-days: 14

  # ---- 发行版容器：使用系统 Qt，避免在容器内重复下载整套 Qt ----
  # Distro containers: use system Qt packages instead of re-downloading the Qt SDK.
  linux-distro:
    strategy:
      fail-fast: false
      matrix:
        target: [debian, arch]
        include:
          - target: debian
            image: debian:bookworm
          - target: arch
            image: archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian dependencies
        if: matrix.target == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build dpkg-dev file \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libqt6core5compat6-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window

      - name: Install Arch dependencies
        if: matrix.target == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel cmake ninja \
            qt6-base qt6-declarative qt6-svg qt6-tools qt6-5compat

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdei-connect-${{ matrix.target }}
          path: build
          retention-days: 14

  # ---- Android：实验性工具链，暂不阻塞主线（APK 待真机 / 工具链验证）----
  # Android: experimental toolchain, non-blocking until APK packaging is verified.
  android:
    name: Android (experimental)
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Qt 6.8.3 host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: gcc_64
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-host
          cache: true
          set-env: false

      - name: Install Qt 6.8.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-android
          cache: true
          set-env: false

      - name: Install Android SDK packages and NDK r26b
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Configure (Android arm64-v8a Debug, experimental)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/qt-android/6.8.3/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$RUNNER_TEMP/qt-host/6.8.3/gcc_64" \
            -DQT_ANDROID_SIGN_APK=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_NDK_HOST=linux-x86_64 \
            -DJAVA_HOME="$JAVA_HOME"

      - name: Build APK (experimental)
        run: cmake --build build-android --target apk

      - name: Upload Android Debug APK (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: gdei-connect-android-arm64-v8a-debug
          path: build-android/android-build/gdei-connect.apk
          if-no-files-found: error
          retention-days: 14
