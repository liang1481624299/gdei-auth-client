# CI：Windows / macOS / Ubuntu / Arch 多架构配置构建；Android 双 ABI 实验性脚手架。
# CI: configure & build Windows / macOS / Ubuntu / Arch across arches; Android dual-ABI scaffold.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- 原生 Runner：Windows / macOS，按 x64 / ARM 矩阵；Qt 由 install-qt-action 缓存 ----
  # Native runners: Windows / macOS across x64 / ARM; Qt cached via install-qt-action.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            qt-arch: win64_msvc2022_64
            experimental: false
          - target: windows-arm64
            runner: windows-11-arm
            qt-arch: win64_msvc2022_arm64
            experimental: true
          - target: macos-x64
            runner: macos-15-intel
            qt-arch: clang_64
            experimental: false
          - target: macos-arm64
            runner: macos-latest
            # Qt macOS 预编译包为 universal2（x86_64+arm64），arch 名统一为 clang_64；
            # 官方 6.8.3 仓库没有独立的 clang_arm64 目录，填它会在解析 XML 时找不到 qt_base。
            # Qt macOS packages are universal2; there is no standalone clang_arm64 archive.
            qt-arch: clang_64
            experimental: false
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # install-qt-action 内部默认拉取 >=3.14 的 Python；aqtinstall 3.3 在 Python 3.15 下
      # 解析 Qt 包元数据会失败（报 qt_base/qt5compat not found）。前置固定 3.12 并让
      # action 复用该 Python（setup-python: false），避免它再装到 3.15。
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          modules: qt5compat
          cache: true
          setup-python: false

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdei-auth-client-${{ matrix.target }}
          path: build
          retention-days: 14

  # ---- Ubuntu 原生 Runner：x64 / arm64，使用系统 Qt 包 ----
  # Ubuntu native runners: x64 / arm64, system Qt packages.
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-x64
            runner: ubuntu-24.04
          - target: ubuntu-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libqt6core5compat6-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdei-auth-client-${{ matrix.target }}
          path: build
          retention-days: 14

  # ---- 发行版容器：Debian / Arch x64，使用系统 Qt，避免在容器内重复下载整套 Qt ----
  # Distro containers: Debian / Arch x64, system Qt packages instead of re-downloading the Qt SDK.
  linux-distro:
    strategy:
      fail-fast: false
      matrix:
        target: [debian, arch]
        include:
          - target: debian
            image: debian:bookworm
          - target: arch
            image: archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian dependencies
        if: matrix.target == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build dpkg-dev file \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libqt6core5compat6-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window

      - name: Install Arch dependencies
        if: matrix.target == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel cmake ninja \
            qt6-base qt6-declarative qt6-svg qt6-tools qt6-5compat

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdei-auth-client-${{ matrix.target }}-x64
          path: build
          retention-days: 14

  # ---- Android：arm64-v8a + x86_64 双 ABI，实验性工具链，暂不阻塞主线 ----
  # Android: arm64-v8a + x86_64 dual ABI, experimental, non-blocking until verified on devices.
  android:
    name: Android (experimental)
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 与 native 任务一致：固定 Python 3.12，避免 aqt 3.3 在 Python 3.15 下解析 Qt 元数据失败。
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Qt 6.8.3 host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-host
          cache: true
          set-env: false
          setup-python: false

      - name: Install Qt 6.8.3 Android arm64-v8a
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-android-arm64
          cache: true
          set-env: false
          setup-python: false

      - name: Install Qt 6.8.3 Android x86_64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_x86_64
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-android-x86_64
          cache: true
          set-env: false
          setup-python: false

      - name: Install Android SDK packages and NDK r26b
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Configure (Android dual ABI Debug, experimental)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/qt-android-arm64/6.8.3/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$RUNNER_TEMP/qt-host/6.8.3/linux_gcc_64" \
            -DQT_ANDROID_SIGN_APK=OFF \
            -DQT_ANDROID_ABIS="arm64-v8a;x86_64" \
            -DQT_PATH_ANDROID_ABI_arm64-v8a="$RUNNER_TEMP/qt-android-arm64/6.8.3/android_arm64_v8a" \
            -DQT_PATH_ANDROID_ABI_x86_64="$RUNNER_TEMP/qt-android-x86_64/6.8.3/android_x86_64" \
            -DQT_ANDROID_MULTI_ABI_FORWARD_VARS="ANDROID_SDK_ROOT;ANDROID_NDK_ROOT;QT_HOST_PATH;JAVA_HOME" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_NDK_HOST=linux-x86_64 \
            -DJAVA_HOME="$JAVA_HOME"

      - name: Build APK (experimental)
        run: cmake --build build-android --target apk

      - name: Upload Android Debug APK (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: gdei-auth-client-android-arm64-v8a-x86_64-debug
          path: build-android/android-build/gdei-auth-client.apk
          if-no-files-found: error
          retention-days: 14
