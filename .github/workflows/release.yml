# Release：推送 v* 标签时，按平台调用 packaging/ 脚本打包并挂到 GitHub Release。
# Release: on a v* tag, run the per-platform packaging/ scripts and attach artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # ---- Windows: windeployqt 收集依赖并归档 zip ----
      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File packaging/windows/deploy.ps1 -BuildDir build -DistDir dist -QmlDir qml

      # ---- macOS: macdeployqt 收编框架并制作 dmg ----
      - name: Stage macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos/deploy.sh build dist

      # ---- Linux: 归档二进制 tar.gz（deb/rpm/Arch 在对应容器内生成） ----
      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/deploy.sh build dist

      # 非标签触发（workflow_dispatch 冒烟）：产物作为工作流归档，不挂 Release。
      # Non-tag smoke dispatch: keep artifacts as workflow artifacts, not a Release.
      - name: Upload workflow artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

      # 仅 v* 标签触发时把产物挂到 GitHub Release。
      # Attach artifacts to the GitHub Release only on v* tag pushes.
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
