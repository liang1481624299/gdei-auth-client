# Release：推送 v* 标签时按平台调用 packaging/ 脚本打包并挂到 GitHub Release。
# Release: on a v* tag, run per-platform packaging/ scripts and attach artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- 原生 Runner：Windows zip / macOS dmg，Qt 缓存复用 ----
  # Native runners: Windows zip / macOS dmg, cached Qt.
  package-native:
    strategy:
      fail-fast: false
      matrix:
        target: [windows, macos]
        include:
          - target: windows
            runner: windows-latest
          - target: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          modules: qt5compat
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage Windows package
        if: matrix.target == 'windows'
        shell: pwsh
        run: pwsh -File packaging/windows/deploy.ps1 -BuildDir build -DistDir artifacts/windows -QmlDir qml

      - name: Stage macOS package
        if: matrix.target == 'macos'
        shell: bash
        run: bash packaging/macos/deploy.sh build artifacts/macos

      # 非标签触发（workflow_dispatch 冒烟）：产物作为工作流归档，不挂 Release。
      - name: Upload workflow artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.zip
            artifacts/macos/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- 发行版容器：Debian 出 deb，Arch 出 tar.gz；使用系统 Qt ----
  # Distro containers: Debian deb, Arch tar.gz; system Qt packages.
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        target: [debian, arch]
        include:
          - target: debian
            image: debian:bookworm
          - target: arch
            image: archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian dependencies
        if: matrix.target == 'debian'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git build-essential cmake ninja-build dpkg-dev file \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libqt6core5compat6-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window

      - name: Install Arch dependencies
        if: matrix.target == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel cmake ninja \
            qt6-base qt6-declarative qt6-svg qt6-tools qt6-5compat

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Debian DEB
        if: matrix.target == 'debian'
        run: |
          cmake -E make_directory artifacts/debian
          cd build && cpack -G DEB -C Release
          mv *.deb ../artifacts/debian/ 2>/dev/null || true

      - name: Package Arch tarball
        if: matrix.target == 'arch'
        shell: bash
        run: bash packaging/linux/deploy.sh build artifacts/arch

      - name: Upload workflow artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/debian/*.deb
            artifacts/arch/*.tar.gz
            artifacts/arch/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Android：实验性未签名 APK，仅上传工作流产物，待工具链与真机验证后再挂 Release ----
  # Android: experimental unsigned APK; workflow artifact only until verified.
  package-android:
    name: Android (experimental)
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 与 native 任务一致：固定 Python 3.12，避免 aqt 3.3 在 Python 3.15 下解析 Qt 元数据失败。
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Qt 6.8.3 host tools
        id: qt-host
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-host
          cache: true
          set-env: false
          setup-python: false

      - name: Install Qt 6.8.3 Android arm64-v8a
        id: qt-arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-android-arm64
          cache: true
          set-env: false
          setup-python: false

      - name: Install Qt 6.8.3 Android x86_64
        id: qt-x86
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_x86_64
          modules: qt5compat
          dir: ${{ runner.temp }}/qt-android-x86_64
          cache: true
          set-env: false
          setup-python: false

      - name: Install Android SDK packages and NDK r26b
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure (Android dual ABI Release unsigned, experimental)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.qt-arm64.outputs.qt-root-dir }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ steps.qt-host.outputs.qt-root-dir }}" \
            -DQT_ANDROID_SIGN_APK=OFF \
            -DQT_ANDROID_ABIS="arm64-v8a;x86_64" \
            -DQT_PATH_ANDROID_ABI_arm64-v8a="${{ steps.qt-arm64.outputs.qt-root-dir }}" \
            -DQT_PATH_ANDROID_ABI_x86_64="${{ steps.qt-x86.outputs.qt-root-dir }}" \
            -DQT_ANDROID_MULTI_ABI_FORWARD_VARS="ANDROID_SDK_ROOT;ANDROID_NDK_ROOT;QT_HOST_PATH;JAVA_HOME" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_NDK_HOST=linux-x86_64 \
            -DJAVA_HOME="$JAVA_HOME"

      - name: Build APK (experimental)
        run: cmake --build build-android --target apk

      - name: Stage unsigned Android Release APK (experimental)
        run: |
          cmake -E make_directory artifacts/android
          cp build-android/android-build/gdei-auth-client.apk \
            artifacts/android/gdei-auth-client-android-arm64-v8a-x86_64-release-unsigned.apk

      - name: Upload unsigned Android Release APK (experimental)
        uses: actions/upload-artifact@v4
        with:
          name: gdei-auth-client-android-arm64-v8a-x86_64-release-unsigned
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 7
